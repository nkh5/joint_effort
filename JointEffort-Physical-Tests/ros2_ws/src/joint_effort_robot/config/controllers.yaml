{
  "controller_manager": {
    "ros__parameters": {
      "update_rate": 50,
      "joint_state_broadcaster": {
        "type": "joint_state_broadcaster/JointStateBroadcaster"
      },
      "iron_arm_controller": {
        "type": "joint_trajectory_controller/JointTrajectoryController"
      },
      "wire_arm_controller": {
        "type": "joint_trajectory_controller/JointTrajectoryController"
      }
    }
  },
  "iron_arm_controller": {
    "ros__parameters": {
      "joints": [
        "iron_base_yaw",
        "iron_shoulder_pitch",
        "iron_elbow_pitch",
        "iron_wrist_pitch",
        "iron_wrist_yaw"
      ],
      "command_interfaces": [
        "position"
      ],
      "state_interfaces": [
        "position",
        "velocity"
      ],
      "allow_partial_joints_goal": false,
      "interpolate_from_desired_state": false,
      "allow_nonzero_velocity_at_trajectory_end": true
    }
  },
  "wire_arm_controller": {
    "ros__parameters": {
      "joints": [
        "wire_base_yaw",
        "wire_shoulder_pitch",
        "wire_elbow_pitch",
        "wire_wrist_pitch",
        "wire_wrist_yaw"
      ],
      "command_interfaces": [
        "position"
      ],
      "state_interfaces": [
        "position",
        "velocity"
      ],
      "allow_partial_joints_goal": false,
      "interpolate_from_desired_state": false,
      "allow_nonzero_velocity_at_trajectory_end": true
    }
  }
}
