amw_forwarder:
  ros__parameters:
    mapping_confirmed: false
    stick_axes: [0, 1, 2]
    stick_signs: [1.0, 1.0, 1.0]
    slider_axis: 3
    slider_low_axis: 1.0
    enable_button: 7     # Pico_Controller.ino virtual bit: 1 while ON and not paused (latched in the Pico)
    mode_button: 0       # stick button: mode toggle (the Pico also pauses; panel 2 resumes)
    stick_deadzone: 0.08
    input_timeout: 0.15
    command_timeout: 0.12
joy_node:
  ros__parameters:
    device_name: AMW Controller   # Pico_Controller.ino: manufacturer "AMW" + product "Controller"
    deadzone: 0.0
    autorepeat_rate: 50.0
    coalesce_interval_ms: 1
    sticky_buttons: false
