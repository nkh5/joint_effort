joy_teleop:
  ros__parameters:
    translate:
      type: topic
      interface_type: geometry_msgs/msg/TwistStamped
      topic_name: /amw/cmd_raw
      deadman_buttons: [0]
      axis_mappings:
        twist-linear-x: {axis: 0, scale: 0.01, offset: 0.0}
        twist-linear-y: {axis: 1, scale: 0.01, offset: 0.0}
        twist-linear-z: {axis: 2, scale: 0.01, offset: 0.0}
        header-frame_id: {value: world}
    rotate:
      type: topic
      interface_type: geometry_msgs/msg/TwistStamped
      topic_name: /amw/cmd_raw
      deadman_buttons: [1]
      axis_mappings:
        twist-angular-z: {axis: 0, scale: 0.1, offset: 0.0}
        twist-angular-y: {axis: 1, scale: 0.1, offset: 0.0}
        header-frame_id: {value: world}
