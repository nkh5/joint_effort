# Teleop settings: the Joy-Con (amw_joycon) and the amw_teleop node.
# Edit and restart `amw start` (no rebuild needed).

amw_teleop:
  ros__parameters:
    # --- Joy-Con mapping (indices into the /joy message from amw_joycon; see joycon.py BUTTONS) ---
    #   buttons: 0 L, 1 ZL, 2 D-pad up, 3 D-pad down, 4 D-pad right, 5 D-pad left, 6 minus, 7 capture,
    #            8 stick click, 9 SL, 10 SR          axes: 0 stick x (right +), 1 stick y (up +)
    stick_axes: [0, 1]
    stick_signs: [-1.0, -1.0]      # flip an entry to reverse that stick axis (x/y moves)
    z_sign: -1.0                   # L + stick up: -1 = tip goes down, 1 = up (independent of stick_signs)
    on_button: 4                   # D-pad right: ON/OFF (toggles on each press)
    speed_up_button: 2             # D-pad up: speed level + speed_step
    speed_down_button: 3           # D-pad down: speed level - speed_step
    z_button: 0                    # L held: stick up/down moves the tip up/down
    rotate_button: 1               # ZL held: the iron points the way the Joy-Con points (stick ignored)
    recenter_button: 5             # D-pad left: hold the Joy-Con upright and press = "iron straight down"
    speed_step: 2                  # levels per press (1..20; 10 = 1x)
    start_level: 10
    stick_deadzone: 0.12           # round deadzone (fraction of full stick); raise for stronger tremor
    stick_expo: 0.6                # 0 = linear, 1 = cubic: gentle near the centre, full speed at the edge
    centre_time_s: 0.2             # stick centred this long before the arm moves (after ON or a mode change)
    input_timeout_s: 0.15          # no controller report this long -> arm turns OFF
    imu_timeout_s: 0.15            # no Joy-Con motion data this long while ZL is held -> arm turns OFF

    # --- ZL pointing: Joy-Con upright (long side vertical, stick facing you) = iron straight down; ---
    # --- tilting the Joy-Con tilts the iron away from vertical. D-pad left sets that upright pose.   ---
    # Axis numbers are the Joy-Con's gyro axes as `amw joystick` shows them (0 x, 1 y, 2 z):
    hand_long_axis: 1              # the axis that moves when you twist the upright Joy-Con about its long side
    hand_axes: [0, 2]              # the other two: [tilts the iron about world X, about world Y]
    hand_signs: [1.0, 1.0]         # flip one if the iron tilts the opposite way to the Joy-Con
    hand_scale: 1.0                # iron tilt per Joy-Con tilt (0.5 = half, steadier)
    hand_max_angle_deg: 60.0       # most the iron tilts from vertical
    hand_gain_per_s: 3.0           # how quickly the iron catches up with the Joy-Con (capped by angular speed)
    hand_gravity_gain: 1.0         # how strongly gravity corrects the Joy-Con's tilt drift (0 = gyro only)

    # --- speed (full stick at speed level 10; level 1 = 0.1x, level 20 = 2x) ---
    linear_speed_m_s: 0.01
    z_speed_ratio: 0.5                   # up/down (L held) at this fraction of the x/y speed
    angular_speed_rad_s: 0.1             # fastest the iron turns toward the hand at level 10
    task_max_linear_speed_m_s: 0.02      # hard cap on tip speed
    task_max_angular_speed_rad_s: 0.2    # hard cap on pointing rate

    # --- five-joint solve (tip XYZ + iron pointing; roll about the iron is free) ---
    task_orientation_length_m: 0.12      # weights pointing vs. position
    task_damping_m: 0.002                # damped inverse: limits joint speed near awkward poses
    task_min_singular_value_m: 0.003     # below this the arm slows (warning SINGULARITY)
    joint_limit_margin_rad: 0.05         # joints this close to a limit stop pushing into it
                                         # (keep above Servo's joint_limit_margins, 0.04)

    # --- safety checks ---
    feedback_timeout_s: 0.3              # joint states older than this -> OFF
    limit_tolerance_deg: 2.0             # a joint may sag/overshoot this far past a limit before -> OFF
    motor_warm_c: 55.0                   # warning
    motor_hot_c: 65.0                    # -> OFF
    motor_volt_min: 9.5                  # motor supply outside this range -> OFF
    motor_volt_max: 14.0

amw_joycon:
  ros__parameters:
    device_name: Joy-Con (L)       # part of the kernel input-device name; "Pro Controller" also works
    publish_rate_hz: 100.0
    invert_y: true                 # hid-nintendo reports stick up as negative; true makes up = +y
    calibration_s: 1.0             # Joy-Con held still this long at start: gyro bias + stick centre
    still_deg_s: 1.5               # more rotation than this restarts the calibration
