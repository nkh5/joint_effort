# MoveIt Servo settings (loaded by amw.launch.py as the iron_servo node's parameters).
# The task bridge sends joint velocities to Servo; Servo smooths them, checks joint limits and
# collisions, and streams trajectories to iron_arm_controller.
moveit_servo:
  move_group_name: iron_arm
  publish_period: 0.02                 # s (50 Hz, same as the controller)
  command_in_type: speed_units
  incoming_command_timeout: 0.12       # s without a command -> Servo stops
  max_expected_latency: 0.08
  joint_command_in_topic: /iron_servo/delta_joint_cmds
  cartesian_command_in_topic: /iron_servo/unused_twist
  pose_command_in_topic: /iron_servo/unused_pose
  command_out_topic: /iron_arm_controller/joint_trajectory
  command_out_type: trajectory_msgs/JointTrajectory
  publish_joint_positions: true
  publish_joint_velocities: true
  publish_joint_accelerations: false
  joint_topic: /joint_states
  # Servo keeps its own planning scene (table, PCB and fixture come from the URDF).
  is_primary_planning_scene_monitor: true
  monitored_planning_scene_topic: /iron_servo/unused_external_scene
  check_collisions: true
  collision_check_rate: 25.0
  self_collision_proximity_threshold: 0.004   # m
  scene_collision_proximity_threshold: 0.004  # m
  joint_limit_margins: [0.04]                 # rad: Servo halts this close to a joint limit
  use_smoothing: true
